name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main and agrees with the version
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(jq -er .version package.json)
          test "$GITHUB_REF_NAME" = "v$version"
      # Node 24.22.3 has npm 11.19.1. Staged publishing needs npm 11.15.0 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the npm version
        shell: bash
        run: |
          npm_version=$(npm --version)
          [[ "$npm_version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
          if ((major < 11 || (major == 11 && minor < 15))); then
            echo "::error::npm $npm_version can not stage a version. It needs npm 11.15.0 or newer."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # RELEASE.md gives the steps for each mode.
      # - NPM_TOKEN is set: the first version only. The token is stage-only. npm stages
      #   the version, and the release owner approves it with 2FA.
      # - NPM_TOKEN is empty: every later version. npm signs in with the workflow
      #   identity (trusted publishing) and adds provenance on its own.
      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm stage publish --provenance --access public
          else
            npm publish --access public
          fi
